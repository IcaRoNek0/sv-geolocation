# 训练配置。规模与算力前提见 PLAN.md：3 万条数据、Colab 免费 T4（16GB, fp16）。
# 这个规模下算力严重过剩而数据是唯一瓶颈，所以增强开得较大、模型取小。

# ── 视图与增强 ──────────────────────────────────────────────────────
views:
  # 4 个 90° 视图正好无缝铺满 360°，覆盖不损失。8 个视图有两倍重叠，
  # 只换来注意力池化多一点选择，代价是视图切分与增强的开销翻倍——
  # 而实测数据管线是瓶颈（等数据 : 算梯度 ≈ 4:1），所以取 4。
  # 显存不是约束（主干冻结时只训 2M 参数），CPU 才是。
  n_max: 4
  fov: 90.0
  size: 224             # T4 算力有限，224 起步；显存够但吞吐是瓶颈
  single_view_prob: 0.15  # 以该概率只给单视图——推理输入可能只是一张截图
  brightness: 0.3
  contrast: 0.3
  saturation: 0.3
  channel_gain: 0.05
  crop_scale: [0.7, 1.0]
  blur_prob: 0.15

# ── 模型 ────────────────────────────────────────────────────────────
backbone: convnext_tiny
pretrained: true
drop: 0.2
freeze_backbone: true   # 先冻结主干跑通，再解冻
unfreeze_after: 2       # 第 2 个 epoch 起解冻

# ── 优化 ────────────────────────────────────────────────────────────
batch_size: 8           # 按样本数而非图片数：8 样本 × 最多 8 视图 = 最多 64 张 224²
accum: 2                # 梯度累积，等效 batch 16
lr: 3.0e-4
weight_decay: 0.05
epochs: 40
clip: 5.0

# ── 运行 ────────────────────────────────────────────────────────────
workers: 2              # Colab 12.7GB 内存，别开大
eval_batch: 16
log_every: 20
ckpt_minutes: 25        # Colab 会话 4-6 小时会被回收，按时间而非 epoch 存盘

# ── 损失 ────────────────────────────────────────────────────────────
soft_half_km: 50.0      # 地理软标签的半衰距离：相距 50km 的县拿到约一半权重
loss:
  w_county: 1.0
  w_city: 0.3
  w_prov: 0.2
  w_coord: 0.1
  label_smoothing: 0.05
