# Kaggle dual T4. New output directory required; do not resume round2 optimizer.
task: environment
backbone: convnext_tiny
pretrained: true
freeze_backbone: false
backbone_lr_scale: 0.1
drop: 0.2
# Variable valid-view counts must not trigger repeated cuDNN autotuning.
pack_views: true
cudnn_benchmark: false
views:
  n_max: 4
  size: 224
  fov: 90.0
  fov_range: [55.0, 95.0]
  pitch_range: [-12.0, 12.0]
  single_view_prob: 0.5
  screenshot_prob: 0.7
  brightness: 0.15
  contrast: 0.15
  saturation: 0.15
  channel_gain: 0.03
  crop_scale: [0.85, 1.0]
  blur_prob: 0.1
  jpeg_prob: 0.3
  jpeg_quality: [65, 95]
  resize_prob: 0.2
# Per GPU; effective batch = 8 x 2 x 2 = 32.
batch_size: 8
accum: 2
lr: 0.0003
weight_decay: 0.05
epochs: 15
pct_start: 0.05
clip: 5.0
workers: 2
cpu_threads: 1
eval_batch: 16
eval_modes: [panorama, single]
selection_split: val_national_single
selection_metric: top1
eval_every: 1
ckpt_minutes: 25
soft_half_km: 20.0
loss:
  geo_mix: 0.15
  label_smoothing: 0.02
  w_county: 1.0
  w_view: 0.25
  w_city: 0.2
  w_prov: 0.1
  w_coord: 0.05
